server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Copiar aquí el contenido de dist/ después de npm run build.
    root /var/www/clinica-nutrivida;
    index index.html;

    # Proxy inverso hacia el microservicio de autenticación. El frontend usa
    # estas rutas relativas en producción (ver .env.production), así evito
    # problemas de CORS y no expongo los puertos internos.
    location /api/auth-service/v1/ {
        proxy_pass http://127.0.0.1:8081/api/v1/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy inverso hacia el microservicio de citas.
    location /api/citas-service/v1/ {
        proxy_pass http://127.0.0.1:8082/api/v1/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:css|js|mjs|png|jpg|jpeg|svg|webp|woff2?)$ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public";
    }
}
